# Cần trong .env (cùng thư mục): RABBITMQ_USER, RABBITMQ_PASS (mật khẩu mạnh, không dùng cleanwise/cleanwise)
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: core.settings.prod
  CELERY_EAGER: "0"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-cleanwise}:${RABBITMQ_PASS:?Thiếu RABBITMQ_PASS trong .env}@rabbitmq:5672//

services:
  nginx:
    image: nginx:alpine
    container_name: cleanwise-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro   # file này phải tồn tại, upstream là web:8000
    depends_on:
      - web

  web:
    build: .
    container_name: cleanwise-web
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    expose:
      - "8000"
    depends_on:
      - redis
      - rabbitmq

  celery-worker:
    build: .
    container_name: cleanwise-celery-worker
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    command: celery -A core worker -l info
    depends_on:
      - redis
      - rabbitmq

  # CHỈ chạy ĐÚNG 1 container beat (chạy 2 cái là mọi task định kỳ bị bắn đôi).
  celery-beat:
    build: .
    container_name: cleanwise-celery-beat
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    command: celery -A core beat -l info -s /beat/celerybeat-schedule
    volumes:
      - beat_data:/beat
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # volatile-lru: chỉ đá key CÓ TTL, tránh mất key idempotency khi đầy bộ nhớ.
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cleanwise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Thiếu RABBITMQ_PASS trong .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  redis_data:
  rabbitmq_data:
  beat_data: